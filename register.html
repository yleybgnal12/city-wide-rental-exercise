<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Register - CityWide Rental</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Poppins', sans-serif;
        background: #000000;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ========== ናቪጌሽን ባር - ለሞባይል ተስማሚ ========== */
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 5%;
        background: rgba(0, 0, 0, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        flex-wrap: wrap;
        gap: 12px;
      }

      .logo {
        font-size: 1.4rem;
        font-weight: 800;
        color: white;
        cursor: pointer;
        font-family: 'Playfair Display', serif;
      }

      .logo span {
        color: #FFB347;
      }

      nav ul {
        display: flex;
        list-style: none;
        gap: 1rem;
        margin: 0;
        padding: 0;
        flex-wrap: wrap;
        justify-content: center;
      }

      nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.85rem;
        transition: 0.2s;
        white-space: nowrap;
      }

      nav ul li a:hover {
        color: #FFB347;
      }

      /* ቋንቋ መምረጫ እና ቲም */
      .nav-controls {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .lang-select {
        padding: 5px 10px;
        border-radius: 30px;
        background: rgba(0,0,0,0.8);
        color: white;
        border: 1px solid rgba(255,255,255,0.3);
        cursor: pointer;
        font-size: 0.75rem;
      }

      .lang-select option {
        background: #000000;
        color: white;
      }

      .theme-toggle-btn {
        background: rgba(0,0,0,0.8);
        border: 1px solid rgba(255,255,255,0.3);
        padding: 5px 12px;
        border-radius: 30px;
        color: white;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-size: 0.75rem;
        transition: 0.2s;
      }

      .theme-toggle-btn:hover {
        background: rgba(0,0,0,0.95);
      }

      /* ========== የምዝገባ ፎርም ክፍል - ለሞባይል ተስማሚ ========== */
      .auth-section {
        flex: 1;
        display: flex;
        align-items: center;
        padding: 40px 20px;
      }

      .auth-container {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        background: rgba(20, 20, 20, 0.95);
        backdrop-filter: blur(15px);
        border-radius: 25px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.15);
        width: 100%;
      }

      .auth-box {
        flex: 1;
        padding: 35px 30px;
        min-width: 260px;
      }

      .register-box {
        background: rgba(30, 30, 30, 0.98);
      }

      .auth-divider {
        width: 1px;
        background: rgba(255,255,255,0.2);
        margin: 30px 0;
      }

      .auth-box h2 {
        font-family: 'Playfair Display', serif;
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        color: white;
      }

      .register-box p {
        color: #aaa;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
      }

      .auth-box h4 {
        font-size: 1.3rem;
        margin-bottom: 0.5rem;
        color: white;
        font-family: 'Playfair Display', serif;
      }

      .auth-box p {
        color: rgba(255,255,255,0.7);
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
      }

      .form-label {
        font-weight: 600;
        font-size: 0.7rem;
        letter-spacing: 1px;
        color: #FFB347;
      }

      .form-control, .form-select {
        border-radius: 12px;
        border: 1px solid #444;
        background: #1a1a1a;
        color: white;
        padding: 10px 14px;
        font-size: 0.9rem;
      }

      .form-control:focus, .form-select:focus {
        border-color: #FFB347;
        background: #222;
        color: white;
        box-shadow: 0 0 0 0.2rem rgba(255, 179, 71, 0.25);
      }

      .form-control::placeholder {
        color: #666;
        font-size: 0.85rem;
      }

      .btn-submit {
        width: 100%;
        padding: 11px;
        background: #FFB347;
        border: none;
        border-radius: 50px;
        font-weight: 600;
        color: #1F2A3A;
        transition: 0.2s;
        margin-top: 10px;
        font-size: 0.95rem;
        cursor: pointer;
      }

      .btn-submit:hover {
        background: #FF9E1A;
        transform: scale(1.02);
      }

      .btn-reg {
        background: transparent;
        border: 2px solid #FFB347;
        color: #FFB347;
        border-radius: 50px;
        transition: 0.2s;
        text-align: center;
        display: inline-block;
        padding: 8px 20px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .btn-reg:hover {
        background: #FFB347;
        color: #1F2A3A;
        transform: scale(1.02);
      }

      footer {
        text-align: center;
        padding: 18px;
        background: rgba(0,0,0,0.9);
        color: rgba(255,255,255,0.5);
        font-size: 0.75rem;
        border-top: 1px solid rgba(255,255,255,0.05);
      }

      /* ========== የሞባይል ምላሽ - ትናንሽ ስክሪኖች ========== */
      @media (max-width: 768px) {
        nav {
          flex-direction: column;
          padding: 0.8rem 4%;
          gap: 10px;
        }
        
        .logo {
          font-size: 1.3rem;
        }
        
        nav ul {
          gap: 0.8rem;
          width: 100%;
          justify-content: center;
        }
        
        nav ul li a {
          font-size: 0.75rem;
        }
        
        .nav-controls {
          width: 100%;
          justify-content: center;
        }
        
        .auth-section {
          padding: 30px 15px;
        }
        
        .auth-container {
          flex-direction: column;
          border-radius: 20px;
        }
        
        .auth-divider {
          width: 80%;
          height: 1px;
          margin: 0 auto;
        }
        
        .auth-box {
          padding: 25px 20px;
          text-align: center;
        }
        
        .auth-box h2 {
          font-size: 1.5rem;
        }
        
        .auth-box h4 {
          font-size: 1.2rem;
        }
        
        .form-control, .form-select {
          padding: 10px 12px;
          font-size: 0.85rem;
        }
        
        .btn-submit {
          padding: 10px;
          font-size: 0.9rem;
        }
        
        .btn-reg {
          padding: 8px 18px;
          font-size: 0.85rem;
        }
        
        footer {
          padding: 15px;
          font-size: 0.7rem;
        }
      }

      /* በጣም ትናንሽ ስክሪኖች (እስከ 480px) */
      @media (max-width: 480px) {
        .logo {
          font-size: 1.1rem;
        }
        
        nav ul {
          gap: 0.6rem;
        }
        
        nav ul li a {
          font-size: 0.7rem;
        }
        
        .lang-select, .theme-toggle-btn {
          font-size: 0.7rem;
          padding: 4px 10px;
        }
        
        .theme-toggle-btn span {
          display: none;
        }
        
        .theme-toggle-btn i {
          font-size: 1rem;
        }
        
        .auth-box {
          padding: 20px 15px;
        }
        
        .auth-box h2 {
          font-size: 1.3rem;
        }
        
        .register-box p {
          font-size: 0.8rem;
        }
        
        .form-label {
          font-size: 0.65rem;
        }
        
        .form-control, .form-select {
          padding: 8px 10px;
          font-size: 0.8rem;
        }
        
        .btn-submit {
          padding: 9px;
          font-size: 0.85rem;
        }
        
        .btn-reg {
          padding: 6px 16px;
          font-size: 0.8rem;
        }
      }

      /* Light mode - ቀላል ሞድ */
      body.light-mode {
        background: #000000;
      }
      
      body.light-mode nav {
        background: rgba(0,0,0,0.95);
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      
      body.light-mode .logo {
        color: white;
      }
      
      body.light-mode nav ul li a {
        color: white;
      }
      
      body.light-mode .auth-container {
        background: rgba(25, 25, 25, 0.98);
        border: 1px solid rgba(255,255,255,0.15);
      }
      
      body.light-mode .register-box {
        background: #1e1e1e;
      }
      
      body.light-mode .auth-box h2,
      body.light-mode .auth-box h4 {
        color: white;
      }
      
      body.light-mode .auth-box p {
        color: #aaa;
      }
      
      body.light-mode .form-control,
      body.light-mode .form-select {
        background: #2a2a2a;
        border-color: #444;
        color: white;
      }
      
      body.light-mode footer {
        background: rgba(0,0,0,0.9);
        color: rgba(255,255,255,0.5);
      }
    </style>
  </head>
  <body>
    <nav>
      <div
        class="logo"
        onclick="window.location.href = 'ma.html'"
        style="cursor: pointer"
      >
        CityWide <span>Rental</span>
      </div>
      <ul>
        <li><a href="ma.html" id="nav-home">Home</a></li>
        <li><a href="ma.html#rentals" id="nav-featured">Featured Gear</a></li>
        <li><a href="ma.html#about" id="nav-about">About Platform</a></li>
      </ul>
      <div class="nav-controls">
        <select id="lang-select" class="lang-select">
          <option value="en">English</option>
          <option value="am">አማርኛ</option>
        </select>
        <div class="theme-toggle">
          <button
            id="theme-toggle-btn"
            class="theme-toggle-btn"
            type="button"
            aria-label="Toggle theme"
          >
            <i class="fas fa-moon"></i><span class="theme-label">Theme</span>
          </button>
        </div>
      </div>
    </nav>

    <section
      class="auth-section container my-auto py-5"
      style="flex: 1; display: flex; align-items: center"
    >
      <div class="auth-container">
        <div class="auth-box register-box">
          <h2 id="register-title">Register</h2>
          <p id="register-subtitle">Create your account</p>
          <form id="register-form">
            <div class="form-group mb-3">
              <label for="reg-name" class="form-label" id="label-name">FULL NAME</label>
              <input
                id="reg-name"
                class="form-control"
                type="text"
                required
                placeholder="Full name"
              />
            </div>
            <div class="form-group mb-3">
              <label for="reg-email" class="form-label" id="label-email">EMAIL</label>
              <input
                id="reg-email"
                class="form-control"
                type="email"
                required
                placeholder="name@domain.com"
              />
            </div>
            <div class="form-group mb-3">
              <label for="reg-phone" class="form-label" id="label-phone">PHONE</label>
              <input
                id="reg-phone"
                class="form-control"
                type="tel"
                required
                placeholder="0911..."
              />
            </div>
            <div class="form-group mb-3">
              <label for="reg-password" class="form-label" id="label-password">PASSWORD</label>
              <input
                id="reg-password"
                class="form-control"
                type="password"
                required
                placeholder="Password"
              />
            </div>
            <div class="form-group mb-3">
              <label for="reg-role" class="form-label" id="label-role">ROLE</label>
              <select id="reg-role" class="form-select" required>
                <option value="" disabled selected id="role-default">Select role</option>
                <option value="client" id="role-client">Client</option>
                <option value="both" id="role-both">Dual-Role</option>
                <option value="lessee" id="role-lessee">Lessee</option>
                <option value="lessor" id="role-lessor">Lessor</option>
                <option value="admin" id="role-admin">Admin</option>
                <option value="superadmin" id="role-superadmin">Super Admin</option>
              </select>
            </div>

            <div
              id="register-message"
              style="margin-bottom: 12px; color: #28a745; font-size: 0.8rem"
            ></div>

            <button type="submit" class="btn-submit" id="register-btn">Register</button>
          </form>
        </div>

        <div class="auth-divider"></div>

        <div class="auth-box">
          <h4 id="signin-title">Already have an account?</h4>
          <p id="signin-text">Sign in to continue.</p>
          <a
            class="btn-reg"
            href="signin.html"
            id="signin-link"
          >Sign In</a>
        </div>
      </div>
    </section>

    <footer>
      <p id="footer-text">© 2026 CityWide Rental</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    
    <script>
      // ቋንቋ ትርጉሞች
      const translations = {
        en: {
          navHome: "Home",
          navFeatured: "Featured Gear",
          navAbout: "About Platform",
          registerTitle: "Register",
          registerSubtitle: "Create your account",
          labelName: "FULL NAME",
          labelEmail: "EMAIL",
          labelPhone: "PHONE",
          labelPassword: "PASSWORD",
          labelRole: "ROLE",
          roleDefault: "Select role",
          roleClient: "Client",
          roleBoth: "Dual-Role",
          roleLessee: "Lessee",
          roleLessor: "Lessor",
          roleAdmin: "Admin",
          roleSuperadmin: "Super Admin",
          registerBtn: "Register",
          signinTitle: "Already have an account?",
          signinText: "Sign in to continue.",
          signinLink: "Sign In",
          footerText: "© 2026 CityWide Rental",
          successMessage: "Registered successfully. Redirecting to sign-in...",
          errorMessage: "Registration failed.",
          emailExists: "Email already exists. Please use a different email."
        },
        am: {
          navHome: "መነሻ",
          navFeatured: "የተመረጡ ንብረቶች",
          navAbout: "ስለ መድረኩ",
          registerTitle: "ተመዝገብ",
          registerSubtitle: "አካውንት ይፍጠሩ",
          labelName: "ሙሉ ስም",
          labelEmail: "ኢሜይል",
          labelPhone: "ስልክ ቁጥር",
          labelPassword: "ይለፍ ቃል",
          labelRole: "ሚና",
          roleDefault: "ሚና ይምረጡ",
          roleClient: "ደንበኛ",
          roleBoth: "ሁለት ሚና",
          roleLessee: "ተከራይ",
          roleLessor: "አከራይ",
          roleAdmin: "አስተዳዳሪ",
          roleSuperadmin: "ከፍተኛ አስተዳዳሪ",
          registerBtn: "ተመዝገብ",
          signinTitle: "አካውንት አለዎት?",
          signinText: "ይግቡ ለመቀጠል",
          signinLink: "ግባ",
          footerText: "© 2026 ሲቲዋይድ ረንታል",
          successMessage: "በሚገባ ተመዝግበዋል። ወደ መግቢያ ገፅ እየተዘዋወሩ ነው...",
          errorMessage: "ምዝገባ አልተሳካም።",
          emailExists: "ኢሜይሉ አስቀድሞ ተመዝግቧል። ሌላ ኢሜይል ይጠቀሙ።"
        }
      };

      let currentLang = localStorage.getItem('register_language') || 'en';

      function updateLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('register_language', lang);
        const t = translations[lang];
        if (!t) return;
        
        document.getElementById('nav-home').textContent = t.navHome;
        document.getElementById('nav-featured').textContent = t.navFeatured;
        document.getElementById('nav-about').textContent = t.navAbout;
        document.getElementById('register-title').textContent = t.registerTitle;
        document.getElementById('register-subtitle').textContent = t.registerSubtitle;
        document.getElementById('label-name').textContent = t.labelName;
        document.getElementById('label-email').textContent = t.labelEmail;
        document.getElementById('label-phone').textContent = t.labelPhone;
        document.getElementById('label-password').textContent = t.labelPassword;
        document.getElementById('label-role').textContent = t.labelRole;
        document.getElementById('role-default').textContent = t.roleDefault;
        document.getElementById('role-client').textContent = t.roleClient;
        document.getElementById('role-both').textContent = t.roleBoth;
        document.getElementById('role-lessee').textContent = t.roleLessee;
        document.getElementById('role-lessor').textContent = t.roleLessor;
        document.getElementById('role-admin').textContent = t.roleAdmin;
        document.getElementById('role-superadmin').textContent = t.roleSuperadmin;
        document.getElementById('register-btn').textContent = t.registerBtn;
        document.getElementById('signin-title').textContent = t.signinTitle;
        document.getElementById('signin-text').textContent = t.signinText;
        document.getElementById('signin-link').textContent = t.signinLink;
        document.getElementById('footer-text').textContent = t.footerText;
        
        window.currentTranslations = t;
      }

      const langSelect = document.getElementById('lang-select');
      if (langSelect) {
        langSelect.addEventListener('change', (e) => updateLanguage(e.target.value));
        langSelect.value = currentLang;
      }
      updateLanguage(currentLang);

      // ቲም ቶግል
      function initTheme() {
        if (localStorage.getItem('theme') === 'light') {
          document.body.classList.add('light-mode');
          const icon = document.querySelector('#theme-toggle-btn i');
          if (icon) icon.classList.replace('fa-moon', 'fa-sun');
        }
      }
      
      function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const icon = document.querySelector('#theme-toggle-btn i');
        if (document.body.classList.contains('light-mode')) {
          localStorage.setItem('theme', 'light');
          if (icon) icon.classList.replace('fa-moon', 'fa-sun');
        } else {
          localStorage.setItem('theme', 'dark');
          if (icon) icon.classList.replace('fa-sun', 'fa-moon');
        }
      }
      
      const themeBtn = document.getElementById('theme-toggle-btn');
      if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
      initTheme();

      // የምዝገባ ፎርም ማስገቢያ
      document.getElementById("register-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const phone = document.getElementById("reg-phone").value.trim();
        const password = document.getElementById("reg-password").value;
        const role = document.getElementById("reg-role").value;
        const msgEl = document.getElementById("register-message");
        const t = window.currentTranslations || translations.en;

        const res = window.WFEAuth.registerUser({
          name,
          email,
          phone,
          password,
          role,
        });
        
        if (!res.ok) {
          msgEl.style.color = "#ff6b6b";
          if (res.code === "email_exists") {
            msgEl.textContent = t.emailExists;
          } else {
            msgEl.textContent = res.message || t.errorMessage;
          }
          return;
        }
        
        msgEl.style.color = "#4caf50";
        msgEl.textContent = t.successMessage;
        setTimeout(() => {
          window.location.href = "signin.html?email=" + encodeURIComponent(email);
        }, 1200);
      });

      // prefill email if passed
      const params = new URLSearchParams(location.search);
      if (params.get("email"))
        document.getElementById("reg-email").value = params.get("email");
    </script>
  </body>
</html>
